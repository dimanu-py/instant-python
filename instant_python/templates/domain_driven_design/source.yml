{% import "macros.j2" as macros with context %}
{%- set delivery_features = [
  {"feature": "fastapi_application", "template": "fastapi/fastapi_app.yml"}
] %}
{%- set shared_domain_features = [
  {"feature": "value_objects", "template": "exceptions/errors.yml"},
  {"feature": "event_bus", "template": "event_bus/event_bus_domain.yml"},
  {"feature": "fastapi_application", "template": "fastapi/fastapi_domain.yml"}
] %}
{%- set shared_infra_features = [
  {"feature": "event_bus", "template": "event_bus/event_bus_infra.yml"},
  {"feature": "logger", "template": "logger/logger.yml"},
  {"feature": "async_sqlalchemy", "template": "persistence/async_sqlalchemy.yml"},
  {"feature": "async_alembic", "template": "persistence/alembic_migrator.yml"},
  {"feature": "fastapi_application", "template": "fastapi/fastapi_infra.yml"}
] %}
{%- set has_shared_domain = (shared_domain_features | map(attribute="feature") | list) | is_in(template.built_in_features) %}
{%- set has_shared_infra = (shared_infra_features | map(attribute="feature") | list) | is_in(template.built_in_features) %}
- name: {{ general.source_name }}
  type: directory
  python: True
  children:
    - name: delivery
      type: directory
      python: True
{{ macros.render_children_for(delivery_features, 6) }}
    - name: shared
      type: directory
      python: True
{% if has_shared_domain or has_shared_infra %}
      children:
{% if has_shared_domain %}
        - name: domain
          type: directory
          python: True
{{ macros.render_children_for(shared_domain_features, 10) }}
{% endif %}
{% if has_shared_infra %}
        - name: infra
          type: directory
          python: True
{{ macros.render_children_for(shared_infra_features, 10) }}
{% endif %}
{% endif %}
{%- if template.specify_bounded_context %}
    - name: {{ template.bounded_context }}
      type: directory
      python: True
      children:
        - name: {{ template.aggregate_name }}
          type: directory
          python: True
          children:
            - name: application
              type: directory
              python: True
            - name: domain
              type: directory
              python: True
            - name: infrastructure
              type: directory
              python: True
{%- endif %}